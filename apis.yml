aid: taxa
name: Taxa
description: 'Taxa Technologies is a San Francisco and Tokyo synthetic-biology startup
  engineering the human skin microbiome. Its debut consumer product is a shelf-stable
  probiotic deodorant cream: a single application of Taxa Probiotics (25.4 billion CFUs
  in a base of water, mango butter, and sunflower extract) lasts one week by swapping
  out the skin microbes responsible for body odor, with a line focused on Wakiga (severe
  underarm odor). The company frames the skin microbiome as a platform whose microbes
  drive body odor, UV absorption, and mosquito attraction. Backed by Matrix Partners,
  Taxa currently runs a product waitlist and publishes a consumer marketing site with
  People, Science, Terms, and Privacy pages, but no public API, developer documentation,
  or SDKs.'
